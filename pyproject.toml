[project]
name = "route-tester"
version = "0.1.0"
description = "A simple, agent-drivable HTTP route testing client for developers."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Vinicius" }]
keywords = ["http", "api", "rest", "testing", "client", "postman"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "requests>=2.32",
    "pydantic>=2.9",
    "pyside6>=6.8",
]

[project.urls]
Homepage = "https://github.com/LaboraP-D/cerne_route_tester"
Repository = "https://github.com/LaboraP-D/cerne_route_tester"
Issues = "https://github.com/LaboraP-D/cerne_route_tester/issues"

[project.scripts]
route-tester = "route_tester.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "responses>=0.25",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/route_tester"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["route_tester"]
